name: wheels

# Builds self-contained Linux x86_64 wheels with cibuildwheel inside the
# dependency image (see .github/workflows/deps-image.yml) and, on a v* tag,
# attaches them to a GitHub release.
#
# Run by hand on the `profiling` branch, it builds a preview for testers: the
# version becomes a development release (scripts/stamp_dev_version.sh, e.g.
# 0.3.1.dev12; nothing is committed) and the wheels replace those of the
# pre-release `profiling-latest`, which is never marked as the latest release.
# Testers install with
#   pip install --pre --upgrade sdpb-python --find-links \
#     https://github.com/<owner>/sdpb-python/releases/expanded_assets/profiling-latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag of the sdpb-python-deps image to build in (default: the one in pyproject.toml). Use manylinux_2_28-<branch> to try an image built from a branch."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  wheels:
    runs-on: ubuntu-latest
    env:
      PREVIEW: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/profiling' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cibuildwheel==3.2.1
      - name: Stamp a development version (profiling preview)
        id: preview
        if: env.PREVIEW == 'true'
        run: echo "version=$(scripts/stamp_dev_version.sh)" >> "$GITHUB_OUTPUT"
      - name: Use the dependency image given as input
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        run: echo "CIBW_MANYLINUX_X86_64_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sdpb-python-deps:${{ inputs.image_tag }}" >> "$GITHUB_ENV"
      - run: cibuildwheel --output-dir wheelhouse
      # The wheels must run on any x86-64 CPU, not just the AVX2 build host.
      - run: scripts/check_wheel_isa.sh wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: wheelhouse/*.whl
          generate_release_notes: true
      - name: Publish the profiling-latest pre-release
        if: env.PREVIEW == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.preview.outputs.version }}
        run: |
          sdpb="$(git -C c-src/sdpb rev-parse --short=8 HEAD)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/expanded_assets/profiling-latest"
          cat > notes.md <<EOF
          Preview build of the \`profiling\` branch for testing; not a release.

          - sdpb-python $VERSION, commit ${GITHUB_SHA::7}
          - SDPB commit $sdpb
          - includes the profiling options (\`profile_path\`, \`profile_detail\`, ...)

          Install (replaces any installed sdpb-python):

              pip install --pre --upgrade sdpb-python --find-links $url

          To go back, reinstall the release as in the installation guide, adding
          \`--force-reinstall\`.
          EOF
          gh release delete profiling-latest --yes --cleanup-tag || true
          gh release create profiling-latest wheelhouse/*.whl --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Preview $VERSION (profiling branch)" --notes-file notes.md
