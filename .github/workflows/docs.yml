name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The pure-Python modules import the compiled extension lazily, so the
      # API reference builds without SDPB's C++ tool chain.
      - run: pip install sphinx myst-parser furo sphinx-copybutton mpmath
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      # Pages must be enabled once in the repository settings
      # (Settings -> Pages -> Source: "GitHub Actions").
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
