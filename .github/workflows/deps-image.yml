name: deps-image

# Builds the manylinux image with SDPB's dependencies preinstalled and pushes
# it to the GitHub container registry.  Needed only when docker/deps.Dockerfile
# changes; the wheels workflow uses the pushed image.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/deps.Dockerfile
      - .github/workflows/deps-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sdpb-python-deps" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/deps.Dockerfile
          push: true
          build-args: JOBS=4
          tags: |
            ${{ steps.meta.outputs.image }}:manylinux_2_28
            ${{ steps.meta.outputs.image }}:manylinux_2_28-${{ steps.meta.outputs.date }}
