[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdpb-python"
version = "0.2.0"
description = "Python bindings (Cython) for a fork of SDPB, the semidefinite program solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YPWang0818" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["mpmath>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7", "Cython>=3.0", "numpy", "sympy"]
sympy = ["sympy"]
docs = ["sphinx>=7", "myst-parser", "furo", "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/YPWang0818/sdpb-python"
"SDPB fork" = "https://github.com/YPWang0818/sdpb"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdpb_python = ["*.pxd", "*.pyx", "cpp/*.hxx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long-running end-to-end datasets (enable with --run-slow)"]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*"]
skip = ["*-musllinux_*", "*_i686"]
archs = ["x86_64"]
manylinux-x86_64-image = "ghcr.io/ypwang0818/sdpb-python-deps:manylinux_2_28"
before-all = "bash {project}/scripts/cibw_before_all.sh {project}"
test-requires = ["pytest", "mpmath", "numpy", "sympy"]
# -o pythonpath= keeps the source tree off sys.path so the installed wheel is tested.
test-command = "cd {project} && python -m pytest -q -x -o pythonpath= tests"

[tool.cibuildwheel.environment]
PATH = "/opt/deps/bin:$PATH"
LD_LIBRARY_PATH = "/opt/deps/lib:/opt/deps/lib64"
CC = "mpicxx"
CXX = "mpicxx"
